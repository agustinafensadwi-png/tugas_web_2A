<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggunaan Object</title>
</head>
<body>
    <script type="text/javascript">
        // membuat Object
 
        var obj = {
            penulis : "Fensa Dwi Agustina",
            buku : [
                "Modul Pemrograman Dasar",
                "Modul Pemrograman Mobile"
            ],
            hal : 109,
            isTerbit : true
        }
 
        console.log(obj);
    </script>

     <script type="text/javascript">
        //membuat object dengan construtor
 
        function orang(nama,gender,umur,alamat) {
            this.nama = nama;
            this.gender = gender;
            this.umur = umur;
            this.alamat = alamat;
        }
 
        //membuat instance object
        var Dewasa = new orang("Fensa", "P", 20,['Dusun Cangak', 'Kecamatan Kras', 'Kabupaten Kediri']) ;
 
        console.log(Dewasa);
    </script>
</body>
</html>
