<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggunaan Fungsi</title>
</head>
<body>
    <!-- MEMBUAT FUNGSI --> 
<script type="text/javascript">
         
        //fungsi salam
        function salam() {
            document.write('<h2>Halo aku Fensa</h2>');
        }
 
        //memanggil fungsi
        salam();
 
    </script>

    <!-- FUNGSI DENGAN PARAMETER --> 
<script type="text/javascript">
 
        //fungsi dengan parameter
        function tambah(a, b) {
            var c = a+b;
            return c
        }
 
        var penjumlahan=tambah(4,8);
        document.write('hasil dari penjumlahan 4 dan 8 adalah '+penjumlahan);
 
    </script>
</body>
</html>
