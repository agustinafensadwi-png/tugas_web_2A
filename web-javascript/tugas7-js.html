<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Fungsi dengan Parameter</title>
</head>
<body>
    <script type="text/javascript">
 
        //fungsi dengan parameter
        function tambah(a, b) {
            var c = a+b;
            return c
        }
 
        var penjumlahan=tambah(12,30);
        document.write('hasil dari penjumlahan 12 dan 30 adalah '+penjumlahan);
 
    </script>
</body>
</html>
