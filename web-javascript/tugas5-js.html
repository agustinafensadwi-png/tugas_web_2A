<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan DO-WHILE</title>
</head>
<body>
     <script type="text/javascript">
        var a=0;
 
        do {
 
            document.write('<p>Angka ke - '+a+'</p>');
 
            a+=1;
 
        } while(a<10);
    </script>
</body>
</html>
