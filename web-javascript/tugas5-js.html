<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan WHILE</title>
</head>
<body>
    <script type="text/javascript">
        var a=0;
 
        while(a<10) {
 
            document.write('<p>Tulisan ini diulang 10 kali</p>');
 
            a+=1;
        }
    </script>
</body>
</html>
