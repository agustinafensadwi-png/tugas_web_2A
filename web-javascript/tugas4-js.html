<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percabangan SWiTCH</title>
</head>
<body>
     <script type="text/javascript">
        var hari = prompt('Masukan Kode Warna [1 s/d 7]');
 
        switch(hari) {
            case "1" : 
            document.write('<h2>UNGU</h2>');
            break;
            case "2" : 
            document.write('<h2>KUNING</h2>');
            break;
            case "3" : 
            document.write('<h2>MERAH</h2>');
            break;
            case "4" : 
            document.write('<h2>BIRU</h2>');
            break;
            case "5" : 
            document.write('<h2>HIJAU</h2>');
            break;
            case "6": 
            document.write('<h2>COKLAT</h2>');
            break;
            case "7" : 
            document.write('<h2>PUTIH</h2>');
            break;
            default :
            document.write('<h2>MAAF KODE SALAH</h2>');
        }
    </script>
</body>
</html>
