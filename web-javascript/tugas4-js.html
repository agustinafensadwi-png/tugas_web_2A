<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percabangan IF-ELSE</title>
</head>
<body>
    <script type="text/javascript">
        var nilai = prompt('Masukan Nilai Anda');
 
        if (nilai > 85) {
            document.write('<h3>Nilai A</h3>');
        } else if(nilai >= 75) {
            document.write('<h3>Nilai B</h3>');
        } else {
            document.write('<h3>Nilai C</h3>');
        }
    </script>
    </script>
</body>
</html>
